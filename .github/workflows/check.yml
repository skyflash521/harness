name: check

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      # 要求する最低バージョンと最新の両方で走らせる。最低側は README が宣言する下限で、
      # ここで走らせなければ下限で壊れる変更を検出できない。
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install ruff rumdl

      - name: ruff
        run: ruff check

      - name: rumdl
        run: rumdl check

      - name: check section references
        run: python3 scripts/check_section_references.py

      - name: check adoption
        run: python3 plugins/flow/contract/check_adoption.py .

  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml .
          lycheeVersion: v0.24.2

  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: selftests
        run: python3 scripts/run_selftests.py

  stamp:
    runs-on: ubuntu-latest
    # 手動起動では比較範囲を決める sha が渡らないため、この検査は走らせない。
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      # コミット単位の検査は各コミットの親を要求する。浅い checkout では親が存在しない。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: version stamping
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # 新規 ref への初回 push。before が全ゼロで範囲比較に使えない。
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          python3 scripts/stamp_plugin_version.py --check "$range"
